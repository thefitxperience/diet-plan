name: Deploy to GitHub Pages

# The app lives in the nutrifit/ subfolder; this workflow MUST sit at the repo
# root (.github/workflows/) or GitHub will not register it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel an in-flight run: cancelling mid-deploy leaves GitHub's Pages
  # backend in a state that makes the NEXT deploy fail with "Deployment failed,
  # try again later." Let production deploys finish (GitHub's own recommendation).
  cancel-in-progress: false

defaults:
  run:
    working-directory: nutrifit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enable Pages via the API if it isn't already (avoids the manual
      # Settings → Pages → "GitHub Actions" toggle and the first-deploy
      # "Deployment failed, try again later" chicken-and-egg).
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutrifit/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FIT_PROXY_URL: ${{ vars.VITE_FIT_PROXY_URL }}
          VITE_FIT_API_USER: ${{ vars.VITE_FIT_API_USER }}
          VITE_FIT_API_PASS: ${{ vars.VITE_FIT_API_PASS }}
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAIL_WORKER_URL: ${{ vars.VITE_EMAIL_WORKER_URL }}
          VITE_EMAIL_RELAY_TOKEN: ${{ vars.VITE_EMAIL_RELAY_TOKEN }}
          VITE_BASE: /${{ github.event.repository.name }}/
      # SPA fallback so refreshes/deep links resolve to index.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nutrifit/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
