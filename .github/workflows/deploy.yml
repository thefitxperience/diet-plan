name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      

concurrency:
  group: pages-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: nutrifit

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutrifit/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FIT_PROXY_URL: ${{ vars.VITE_FIT_PROXY_URL }}
          VITE_FIT_API_USER: ${{ vars.VITE_FIT_API_USER }}
          VITE_FIT_API_PASS: ${{ vars.VITE_FIT_API_PASS }}
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAIL_WORKER_URL: ${{ vars.VITE_EMAIL_WORKER_URL }}
          VITE_EMAIL_RELAY_TOKEN: ${{ vars.VITE_EMAIL_RELAY_TOKEN }}
          VITE_BASE: /${{ github.event.repository.name }}/

      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
